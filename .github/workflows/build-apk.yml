name: Build Android APK

# 펀드 모의고사 WebView 앱(android/) APK 빌드
#  · Repository Secret 에 고정 서명 키(ANDROID_KEYSTORE_BASE64 등)가 있으면
#    release 빌드를 그 키로 서명합니다. (이후 업데이트는 삭제 없이 덮어쓰기 설치 가능)
#  · 키가 없으면 debug 서명으로 폴백합니다.
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_VERSION: '1.0.1'
  APK_NAME: fund-exam-v1.0.1.apk

jobs:
  build:
    name: assemble APK (${{ github.event_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Android SDK 준비 (platform 34 / build-tools 34.0.0)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            for c in "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager \
                     /usr/local/lib/android/sdk/cmdline-tools/*/bin/sdkmanager; do
              [ -x "$c" ] && SDKMANAGER="$c" && break
            done
          fi
          echo "sdkmanager: ${SDKMANAGER:-none}"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null 2>&1 || true
          fi
          java -version
          gradle --version

      - name: 고정 서명 키스토어 복원 (Secret → 임시 파일)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/fund-exam-release.p12"
            ls -l "$RUNNER_TEMP/fund-exam-release.p12"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/fund-exam-release.p12" >> "$GITHUB_ENV"
            echo "SIGNED_WITH_FIXED_KEY=yes" >> "$GITHUB_ENV"
            echo "고정 서명 키스토어 복원 완료 — release 서명으로 빌드합니다."
          else
            echo "SIGNED_WITH_FIXED_KEY=no" >> "$GITHUB_ENV"
            echo "::warning::ANDROID_KEYSTORE_BASE64 Secret 이 없어 debug 서명으로 빌드합니다."
          fi

      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          chmod +x ./gradlew || true
          if [ -n "${ANDROID_KEYSTORE_PATH:-}" ]; then
            TASK=assembleRelease
          else
            TASK=assembleDebug
          fi
          echo "gradle task: $TASK"
          if [ -x ./gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Building with ./gradlew (wrapper)"
            ./gradlew "$TASK" --no-daemon --stacktrace
          else
            echo "Building with gradle on PATH"
            gradle "$TASK" --no-daemon --stacktrace
          fi

      - name: APK 확인 · 이름 정리
        run: |
          set -e
          ls -lR android/app/build/outputs/apk | head -40
          mkdir -p out
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            SRC=android/app/build/outputs/apk/release/app-release.apk
          elif [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            SRC=android/app/build/outputs/apk/debug/app-debug.apk
          else
            echo "빌드 산출물(APK)을 찾지 못했습니다" && exit 1
          fi
          echo "source apk: $SRC"
          cp "$SRC" "out/$APK_NAME"
          ls -l out
          python3 - <<'PY'
          import os, zipfile
          p = os.path.join("out", os.environ["APK_NAME"])
          z = zipfile.ZipFile(p)
          names = z.namelist()
          print("entries:", len(names))
          assert "AndroidManifest.xml" in names, "APK 안에 AndroidManifest.xml 이 없습니다"
          dex = b"".join(z.read(n) for n in names if n.startswith("classes") and n.endswith(".dex"))
          assert any(n == "assets/loading.html" for n in names), \
              "APK 안에 assets/loading.html 이 없습니다"
          print("assets/loading.html: OK")
          for needle in (b"saveStore", b"loadStore", b"fund_exam_store", b"BadaToeicAndroid"):
              print(needle.decode(), needle in dex)
              assert needle in dex, "dex 안에 %s 문자열이 없습니다" % needle.decode()
          print("dex save-store bridge: OK")
          for needle in (b"fund-exam-app.onrender.com", b"attemptFailed",
                         b"FundExamAndroid/1.0.1", b"api/health"):
              print(needle.decode(), needle in dex)
              assert needle in dex, "dex 안에 %s 문자열이 없습니다" % needle.decode()
          print("dex health/retry wiring: OK")
          # v1.0.1 수정 반영 확인: 응답 지연(서버 깨어나는 중) 분리 · 메인 로드 워치독 · 2분 대기
          for needle in (b"server waking", b"health timeout (server waking)",
                         b"main load watchdog armed", b"main load watchdog fired",
                         b"dom check", b"2\xeb\xb6\x84 \xec\xb4\x88\xea\xb3\xbc"):
              print(needle.decode("utf-8", "replace"), needle in dex)
              assert needle in dex, "dex 안에 %s 가 없습니다" % needle.decode("utf-8", "replace")
          print("dex v1.0.1 fixes: OK")
          PY

      - name: 버전 · 패키지 검증 (aapt / AndroidManifest)
        run: |
          set -e
          AAPT1="$(ls "$ANDROID_HOME"/build-tools/*/aapt 2>/dev/null | head -1)"
          echo "aapt: ${AAPT1:-none}"
          if [ -n "$AAPT1" ]; then
            "$AAPT1" dump badging "out/$APK_NAME" | grep -E "package:|application-label" || true
            "$AAPT1" dump badging "out/$APK_NAME" | grep -q "versionCode='2'" || {
              echo "::error::versionCode 가 2 가 아닙니다" && exit 1; }
            "$AAPT1" dump badging "out/$APK_NAME" | grep -q "versionName='1.0.1'" || {
              echo "::error::versionName 이 1.0.1 이 아닙니다" && exit 1; }
            echo "aapt versionCode=2 / versionName=1.0.1: OK"
          fi
          python3 - <<'PY'
          import os, zipfile
          p = os.path.join("out", os.environ["APK_NAME"])
          data = zipfile.ZipFile(p).read("AndroidManifest.xml")
          def has(s):
              return s.encode("utf-8") in data or s.encode("utf-16-le") in data
          assert has("com.donsik.fundexam"), "AndroidManifest 에 package com.donsik.fundexam 이 없습니다"
          assert has("1.0.1"), "AndroidManifest 에 versionName 1.0.1 이 없습니다"
          print("package com.donsik.fundexam / versionName 1.0.1: OK")
          PY

      - name: 서명 검증 (고정 키 인증서 확인)
        run: |
          set -e
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | head -1)"
          echo "apksigner: ${APKSIGNER:-none}"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner 를 찾지 못해 서명을 검증할 수 없습니다" && exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs "out/$APK_NAME" | tee "$RUNNER_TEMP/sign.txt"
          if [ "${SIGNED_WITH_FIXED_KEY:-no}" = "yes" ]; then
            grep -q "CN=BadaToeic" "$RUNNER_TEMP/sign.txt" || {
              echo "::error::고정 키(CN=BadaToeic)로 서명되지 않았습니다" && exit 1; }
            if grep -q "CN=Android Debug" "$RUNNER_TEMP/sign.txt"; then
              echo "::error::디버그 키로 서명되었습니다" && exit 1
            fi
            echo "고정 서명 키 검증: OK"
          else
            echo "::warning::고정 키 없이 빌드되어 debug 서명입니다."
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fund-exam-v1.0.1-apk
          path: out/fund-exam-v1.0.1.apk
          if-no-files-found: error
          retention-days: 90

      - name: Attach APK to GitHub Release (v1.0.1)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if gh release view v1.0.1 > /dev/null 2>&1; then
            gh release upload v1.0.1 "out/$APK_NAME" --clobber
            gh release edit v1.0.1 \
              --title "펀드 모의고사 v1.0.1 (Android APK)" \
              --notes-file .github/release-notes-v1.0.1.md
          else
            gh release create v1.0.1 \
              --title "펀드 모의고사 v1.0.1 (Android APK)" \
              --notes-file .github/release-notes-v1.0.1.md
            gh release upload v1.0.1 "out/$APK_NAME" --clobber
          fi
